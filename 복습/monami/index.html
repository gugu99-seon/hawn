<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모나미 구현</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="head_top">
            <div class="head_util">
                <div class="con head_util-con">
                    <div class="language">
                        <span>KOR</span>
                        <span class="material-symbols-outlined">keyboard_arrow_down</span>
                    </div>
                    <div class="sns_icon">
                        <ul class="con sns_icon-con">
                            <li>
                                <img src="./image/icon/sns_facebook.gif" alt="페이스북">
                            </li>
                            <li>
                                <img src="./image/icon/sns_insta.gif" alt="인스타그램">
                            </li>
                            <li>
                                <img src="./image/icon/sns_youtube.png" alt="유튜브">
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="head_menu">
                <div class="con head_menu-con">
                    <nav>
                        <ul>
                            <li>HOME</li>
                            <li>SITE MAP</li>
                            <li>CONTACT US</li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
        <div class="con head_main">
            <h1 class="head_logo">
                <img src="./image/logo/logo.jpg" alt="모나미 로고">
            </h1>
            <nav class="head_nav">
                <ul class="con head_nav-con">
                    <li>모나미소개</li>
                    <li>모나미제품</li>
                    <li>NEWS</li>
                    <li>브랜드스토어</li>
                    <li>모나미 미술대회</li>
                    <li>고객지원</li>
                    <li>기업 구매 / 개발</li>
                </ul>
            </nav>
            <div class="con head_icons">
                <span class="material-symbols-outlined">search</span>
                <span class="material-symbols-outlined">menu</span>
            </div>
        </div>
        <div class="main_banner">
            <img src="./image/banner/visual1.jpg" alt="배너 이미지">
        </div>
    </header>
</body>
</html>
