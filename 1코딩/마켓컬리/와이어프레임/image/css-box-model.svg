<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">CSS Box Model 구조</title>
  <desc id="desc">바깥쪽부터 margin, border, padding, content 순서로 겹친 박스 모델 구조도</desc>
  <rect width="800" height="560" fill="#ffffff"/>

  <text x="50" y="54" fill="#20202a" font-family="Pretendard, Arial, sans-serif" font-size="28" font-weight="700">CSS Box Model 구조</text>
  <text x="50" y="80" fill="#666675" font-family="Pretendard, Arial, sans-serif" font-size="15">요소를 감싸는 네 영역 · 바깥쪽에서 안쪽 순서</text>

  <rect x="50" y="106" width="700" height="356" rx="12" fill="#fff1d6" stroke="#e5a93d" stroke-width="2"/>
  <text x="400" y="136" text-anchor="middle" fill="#784b05" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="700">margin · 바깥 여백</text>

  <rect x="98" y="150" width="604" height="268" rx="8" fill="#d87953"/>
  <text x="400" y="176" text-anchor="middle" fill="#ffffff" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">border · 테두리</text>

  <rect x="112" y="186" width="576" height="218" rx="3" fill="#dceef7"/>
  <text x="400" y="213" text-anchor="middle" fill="#205c78" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">padding · 안쪽 여백</text>

  <rect x="170" y="234" width="460" height="130" rx="4" fill="#6a4696"/>
  <text x="400" y="293" text-anchor="middle" fill="#ffffff" font-family="Pretendard, Arial, sans-serif" font-size="23" font-weight="700">content</text>
  <text x="400" y="323" text-anchor="middle" fill="#f2eaff" font-family="Pretendard, Arial, sans-serif" font-size="16">내용이 표시되는 영역</text>

  <text x="50" y="506" fill="#343443" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="600">margin</text>
  <text x="126" y="506" fill="#9999a4" font-family="Pretendard, Arial, sans-serif" font-size="16">→</text>
  <text x="155" y="506" fill="#343443" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="600">border</text>
  <text x="232" y="506" fill="#9999a4" font-family="Pretendard, Arial, sans-serif" font-size="16">→</text>
  <text x="261" y="506" fill="#343443" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="600">padding</text>
  <text x="349" y="506" fill="#9999a4" font-family="Pretendard, Arial, sans-serif" font-size="16">→</text>
  <text x="378" y="506" fill="#343443" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="600">content</text>
</svg>
